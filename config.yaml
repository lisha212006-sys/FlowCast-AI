project:
  name: "FlowCastpip install -r requirements.txt"
  version: "1.0"
  corridor: "Northline Corridor"

paths:
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  reports_dir: "reports"

data_sources:
  traffic_file: "traffic_sensor_log.csv"
  weather_file: "weather_observations.csv"
  calendar_file: "calendar_events.csv"

validation:
  max_speed_kmh: 200.0
  max_occupancy_pct: 100.0
  min_volume: 0

features:
  lag_windows: [1, 2, 48]
  rolling_windows: [4, 8]